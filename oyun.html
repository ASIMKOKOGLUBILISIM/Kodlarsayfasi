index.html<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sayı Bulma Oyunu</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #111, #222);
        color: white;
        text-align: center;
        padding: 30px;
    }
    .box {
        max-width: 400px;
        margin: auto;
        background: #1c1c1c;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(0,0,0,.6);
    }
    button {
        padding: 10px 15px;
        margin: 5px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }
    .up { background: #3498db; color: white; }
    .down { background: #e67e22; color: white; }
    .ok { background: #2ecc71; color: black; }
    input {
        padding: 8px;
        width: 100%;
        margin: 10px 0;
        font-size: 16px;
    }
</style>
</head>

<body>

<div class="box">
    <h2>🎯 Sayı Bulma Oyunu</h2>
    <p>Bir sayı tut, bilgisayar bulsun 😎</p>

    <div id="setup">
        <input type="number" id="max" placeholder="Üst sınır (örn: 100)">
        <button onclick="basla()">Başla</button>
    </div>

    <div id="game" style="display:none">
        <h3 id="tahmin"></h3>
        <button class="up" onclick="cevap('yukari')">⬆ Yukarı</button>
        <button class="down" onclick="cevap('asagi')">⬇ Aşağı</button>
        <button class="ok" onclick="cevap('bildin')">✅ Bildin</button>
        <p id="bilgi"></p>
    </div>
</div>

<script>
let alt = 0;
let ust = 100;
let deneme = 0;
let baslangic;

function basla(){
    ust = parseInt(document.getElementById("max").value);
    if(isNaN(ust) || ust < 1){
        alert("Geçerli bir sayı gir!");
        return;
    }

    document.getElementById("setup").style.display = "none";
    document.getElementById("game").style.display = "block";

    deneme = 0;
    baslangic = Date.now();
    tahminYap();
}

function tahminYap(){
    let tahmin = Math.floor((alt + ust) / 2);
    document.getElementById("tahmin").innerText = "Tahminim: " + tahmin;
}

function cevap(c){
    deneme++;
    let tahmin = Math.floor((alt + ust) / 2);

    if(c === "bildin"){
        let sure = ((Date.now() - baslangic) / 1000).toFixed(2);
        document.getElementById("bilgi").innerHTML =
            `🎉 Buldum!<br>🔢 Deneme: ${deneme}<br>⏱ Süre: ${sure} sn`;
        return;
    }

    if(c === "yukari") alt = tahmin + 1;
    if(c === "asagi") ust = tahmin - 1;

    tahminYap();
}
</script>

</body>
</html>
