@app.get("/", response_class=HTMLResponse)
def dashboard():
    return """
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Security Alert Dashboard</title>

<style>
body {
  background: linear-gradient(135deg, #020617, #020617);
  font-family: Arial, sans-serif;
  color: #e5e7eb;
  padding: 30px;
}

h1 {
  text-align: center;
  margin-bottom: 30px;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 40px;
}

.summary-card {
  padding: 20px;
  border-radius: 14px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.total { background:#1e40af; }
.medium { background:#ca8a04; }
.critical { background:#b91c1c; }

.section {
  margin-bottom: 40px;
}

.section h2 {
  margin-bottom: 15px;
}

.alert {
  background:#020617;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 10px;
  border-left: 6px solid gray;
}

.alert.medium { border-color:#facc15; }
.alert.critical { border-color:#ef4444; }

.alert-title {
  font-weight: bold;
  font-size: 16px;
}
.alert-meta {
  font-size: 14px;
  opacity: 0.9;
}
</style>

<!-- EKLENDİ: IP MAP -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>

<body>

<h1>🚨 Security Alert Dashboard</h1>

<div class="summary">
  <div class="summary-card total" id="total">Toplam: 0</div>
  <div class="summary-card medium" id="medium">Önemsiz (MEDIUM): 0</div>
  <div class="summary-card critical" id="critical">KRİTİK: 0</div>
</div>

<div class="section">
  <h2>🟡 Önemsiz Denemeler</h2>
  <div id="mediumAlerts"></div>
</div>

<div class="section">
  <h2>🔴 Kritik Saldırılar</h2>
  <div id="criticalAlerts"></div>
</div>

<!-- EKLENDİ: IP HARİTA -->
<div class="section">
  <h2>🌍 Kritik Saldırı IP Haritası</h2>
  <div id="map" style="height:400px;border-radius:14px;"></div>
</div>

<script>
async function loadAlerts() {
  const res = await fetch("/alerts");
  const data = await res.json();

  let mediumCount = 0;
  let criticalCount = 0;

  const mediumDiv = document.getElementById("mediumAlerts");
  const criticalDiv = document.getElementById("criticalAlerts");

  mediumDiv.innerHTML = "";
  criticalDiv.innerHTML = "";

  data.forEach(a => {
    const div = document.createElement("div");
    div.className = "alert " + (a.severity === "CRITICAL" ? "critical" : "medium");

    div.innerHTML = `
      <div class="alert-title">${a.type}</div>
      <div class="alert-meta">${a.log || a.ip || ""}</div>
      <div class="alert-meta">⏱ ${a.time}</div>
    `;

    if (a.severity === "CRITICAL") {
      criticalCount++;
      criticalDiv.appendChild(div);
    } else {
      mediumCount++;
      mediumDiv.appendChild(div);
    }
  });

  document.getElementById("total").innerText = "Toplam: " + data.length;
  document.getElementById("medium").innerText = "Önemsiz (MEDIUM): " + mediumCount;
  document.getElementById("critical").innerText = "KRİTİK: " + criticalCount;
}

loadAlerts();
setInterval(loadAlerts, 3000);
</script>

<!-- EKLENDİ: IP MAP SCRIPT -->
<script>
let map = L.map('map').setView([20, 0], 2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18
}).addTo(map);

async function loadIPMap() {
  const res = await fetch("/alerts");
  const data = await res.json();

  data.forEach(a => {
    if (a.ip && a.severity === "CRITICAL") {
      fetch("https://ipapi.co/" + a.ip + "/json/")
        .then(r => r.json())
        .then(loc => {
          if (loc.latitude && loc.longitude) {
            L.circleMarker(
              [loc.latitude, loc.longitude],
              {
                radius: 8,
                color: "#ef4444",
                fillColor: "#ef4444",
                fillOpacity: 0.8
              }
            )
            .addTo(map)
            .bindPopup(
              `<b>IP:</b> ${a.ip}<br>
               <b>Ülke:</b> ${loc.country_name}<br>
               <b>Şehir:</b> ${loc.city}`
            );
          }
        });
    }
  });
}

loadIPMap();
</script>

</body>
</html>
"""
